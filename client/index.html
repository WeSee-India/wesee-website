<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>WeSee — AI Agents, Automation &amp; Software</title>
    <meta
      name="description"
      content="WeSee designs, builds, and ships AI agents, automation, and custom software for ambitious businesses — from lead generation and marketing to internal operations. From Tokyo to Mumbai."
    />
    <meta name="theme-color" content="#111317" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.weseegpt.com/" />

    <!-- Icons (local assets, no third-party dependency) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeSee" />
    <meta property="og:title" content="WeSee — AI Agents, Automation &amp; Software" />
    <meta
      property="og:description"
      content="We design, build, and ship the AI agents, automation, and software ambitious companies run on."
    />
    <meta property="og:url" content="https://www.weseegpt.com/" />
    <meta property="og:image" content="https://www.weseegpt.com/landing/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeSee — AI Agents, Automation &amp; Software" />
    <meta
      name="twitter:description"
      content="We design, build, and ship the AI agents, automation, and software ambitious companies run on."
    />
    <meta name="twitter:image" content="https://www.weseegpt.com/landing/assets/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "WeSee",
        "alternateName": "WeSee AI Automation",
        "url": "https://www.weseegpt.com/",
        "logo": "https://www.weseegpt.com/wesee.jpg",
        "description": "AI automation and engineering studio building custom AI agents, automation, web platforms, and software for ambitious companies.",
        "sameAs": [
          "https://www.linkedin.com/company/wesee-agi",
          "https://www.instagram.com/weseeventures",
          "https://x.com/weseeventures"
        ],
        "address": [
          { "@type": "PostalAddress", "addressLocality": "Tokyo", "addressCountry": "JP" },
          { "@type": "PostalAddress", "addressLocality": "Mumbai", "addressCountry": "IN" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
